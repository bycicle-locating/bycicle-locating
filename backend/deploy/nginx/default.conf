# 对外唯一入口：接收 Cloudflare Tunnel（或显式放开的直连）请求，转发到 backend:8080。
# 直连端口默认只绑 127.0.0.1；TLS 由 Cloudflare 终止。

# Cloudflare 在 Tunnel 入站时设置 X-Forwarded-Proto=https；直连时回退到 $scheme。
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# WebSocket upgrade（M1 实时位置会用到）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Cloudflare 会带 CF-Connecting-IP；本地直连时回退到 peer 地址。
map $http_cf_connecting_ip $real_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# 绑定接口低频且敏感：按真实客户端 IP 做基础限流。
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}
limit_req_zone $client_key zone=bind:10m rate=1r/s;

server {
    listen 8080;
    server_name _;

    server_tokens off;

    # 与后端 api.maxBodyBytes（8 KiB）对齐，避免大包进入应用层。
    client_max_body_size 8k;

    # backend 容器重建后 IP 会变化：用 Docker 内嵌 DNS 每次重新解析，
    # 否则 nginx 会一直拿着旧 IP 返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 后端 WriteTimeout 为 30s，这里留 5s 余量。
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location = /v1/devices:bind {
        limit_req zone=bind burst=5 nodelay;
        proxy_pass http://$backend_upstream;
    }

    location / {
        proxy_pass http://$backend_upstream;
    }
}
