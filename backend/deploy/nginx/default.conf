# 对外唯一入口：接收公网请求，转发到 backend:8080。
# TLS 尚未启用（当前域名只开放 8080），证书就绪后在本文件加 443 server 块即可。
server {
    listen 8080;
    server_name _;

    server_tokens off;

    # 与后端 api.maxBodyBytes（8 KiB）对齐，避免大包进入应用层。
    client_max_body_size 8k;

    # backend 容器重建后 IP 会变化：用 Docker 内嵌 DNS 每次重新解析，
    # 否则 nginx 会一直拿着旧 IP 返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 后端 WriteTimeout 为 30s，这里留 5s 余量。
    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        proxy_pass http://$backend_upstream;
    }
}
