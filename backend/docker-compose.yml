# 部署编排：nginx（唯一对外入口）→ backend。
# 依赖服务（broker/postgres）在 deps profile 下，默认不启动：
#   docker compose --profile deps up -d
name: bicycle-locating

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bicycle-locating/backend:${BKL_IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLAIM_PEPPER: ${CLAIM_PEPPER:?请在 .env 中设置 CLAIM_PEPPER}
      DEV_USER_ID: ${DEV_USER_ID:-}
      DEV_SEED_CLAIM: ${DEV_SEED_CLAIM:-}
    expose:
      - "8080"
    networks: [edge, data]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BKL_HTTP_PORT:-32525}:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # 可选：Cloudflare Tunnel。由本机主动出站，绕开大陆云厂商对未备案域名的入站拦截。
  # 启用：docker compose --profile tunnel up -d cloudflared
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      nginx:
        condition: service_healthy
    networks: [edge]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # 本地依赖，默认不启动。端口只绑回环：匿名 broker 与数据库不能暴露到公网。
  broker:
    profiles: ["deps"]
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    networks: [data]
    logging: *default-logging

  postgres:
    profiles: ["deps"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bkl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: bike_locating
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkl -d bike_locating"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

networks:
  edge:
  data:

volumes:
  broker-data:
  pg-data:
