# 本地开发依赖：MQTT broker + PostgreSQL。
# 生产环境不要用这份配置（匿名访问、无 TLS）。
services:
  broker:
    image: eclipse-mosquitto:2
    container_name: bkl-broker
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: bkl-postgres
    environment:
      POSTGRES_USER: bkl
      POSTGRES_PASSWORD: bkl_dev_password
      POSTGRES_DB: bike_locating
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkl -d bike_locating"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  broker-data:
  pg-data:
