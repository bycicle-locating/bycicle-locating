name: backend

# 不加 paths 过滤：必需的检查必须出现在每个 PR 上，
# 否则只改文档的 PR 会永久卡在 "Expected — Waiting for status to be reported"。
# push 只限 main：否则分支推送与 PR 事件会各跑一遍，白烧私有仓库的 Actions 额度。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w .："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 测试
        run: go test -race ./...

      - name: 竞态与覆盖
        run: go test -cover ./...

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 全链路 e2e（nginx → backend）
        run: bash deploy/e2e.sh

  # Postgres 栈不在默认分支保护里，但每次 PR 都跑，避免 Store/JWT 路径只靠本地验证。
  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Postgres 全链路 e2e（迁移 → JWT → 用户/设备 → Store）
        run: bash deploy/e2e-postgres.sh
