name: firmware-host-tests

# 只测不依赖 ESP-IDF 的纯 C 模块，因此在普通 runner 上几秒就能跑完。
# 完整固件构建需要 ESP-IDF 工具链，属 M1（见 docs/roadmap.md）。

# 不加 paths 过滤：必需的检查必须出现在每个 PR 上（见 CONTRIBUTING.md §1.1）。
# 只测不依赖 ESP-IDF 的纯 C 模块，因此几秒就能跑完，每次都跑不心疼。
on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: 编译纯 C 模块
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -I main -I main/proto -I main/track \
            test/host/test_core.c \
            main/app_types.c main/proto/proto_encode.c \
            main/track/ringbuf.c main/track/uploader.c \
            -o test_core

      - name: 运行主机单测
        run: ./test_core
