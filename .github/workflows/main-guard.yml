name: main-guard

# 作用：直接推送到 main 时把 CI 标红。
#
# 服务端分支保护（enforce_admins=true）已经会拒绝直推，所以本工作流是**兜底**：
# 万一保护规则被临时停用、又有人直推，这里会留下一条失败的检查记录。
# 逐条规则见 docs/branch-protection.md。
#
# 注意：它只能在推送之后发现，拦不住已经推上去的提交。

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  via-pr:
    name: 只允许经 PR 合并
    runs-on: ubuntu-latest
    steps:
      - name: 检查该提交是否关联 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq 'length' 2>/dev/null || echo 0)
          if [ "$prs" -gt 0 ]; then
            echo "OK：该提交关联了 $prs 个 PR。"
            exit 0
          fi

          # 根提交（仓库初始化）豁免，否则首次提交会永远是红的。
          parents=$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')
          if [ "$parents" -eq 0 ]; then
            echo "OK：根提交豁免。"
            exit 0
          fi

          echo "::error::检测到绕过 PR 直接推送到 main。请改用分支 + PR（CONTRIBUTING.md §1.1）。"
          exit 1
